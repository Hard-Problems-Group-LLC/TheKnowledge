[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theknowledge"
version = "0.1.0"
description = "Reusable software engineering standards and operations knowledge base"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
  "black==26.3.1",
  "ruff==0.15.7",
  "pytest==9.0.2",
  "pytest-timeout==2.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
